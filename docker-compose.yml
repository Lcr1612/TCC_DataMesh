services:

  clientes:
    image: postgres:16
    container_name: tcc_clientes
    environment:
      POSTGRES_DB: db_clientes
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: tcc123
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - clientes_data:/var/lib/postgresql/data
    networks:
      - tcc_network

  filiais:
    image: postgres:16
    container_name: tcc_filiais
    environment:
      POSTGRES_DB: db_filiais
